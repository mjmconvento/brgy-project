; Application PHP settings — mounted at /usr/local/etc/php/conf.d/99-app.ini
; Loaded last so these values win over the distribution defaults.

[PHP]
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

upload_max_filesize = 32M
post_max_size = 32M

expose_php = Off

; Errors go to the container log, never to the HTTP response body.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
log_errors_max_len = 0
ignore_repeated_errors = Off

[Date]
date.timezone = Asia/Manila

[Session]
session.cookie_httponly = 1
session.use_strict_mode = 1

[mbstring]
mbstring.internal_encoding = UTF-8

[Assertion]
zend.assertions = -1

[realpath]
realpath_cache_size = 4096k
realpath_cache_ttl = 600
