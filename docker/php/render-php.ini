; PHP overrides for the single-container `render` image stage.
; Mounted at /usr/local/etc/php/conf.d/zz-render.ini so it loads AFTER
; 10-opcache.ini and 99-app.ini and wins.
;
; See docker/php/render-fpm.conf for the memory budget this is part of. The
; short version: Render's Free plan gives the whole container 512 MB, and the
; development settings reserve 192 MB of it for opcache before a single request
; arrives.

; 64 MB is ample for this codebase: ~40 Blade views plus the framework. Check
; the real figure with opcache_get_status()['memory_usage'] if you ever add a
; large dependency.
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8

; The container filesystem is immutable and the image is rebuilt on every
; deploy, so there is nothing to revalidate. Saves a stat() per include.
opcache.validate_timestamps = 0

; Belt and braces alongside php_admin_value in the pool: this also applies to
; `php artisan` invocations the entrypoint makes (config:cache, migrate).
memory_limit = 128M
