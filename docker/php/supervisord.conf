; Two processes, one container — the shape a single-container PaaS instance
; requires. compose keeps nginx and php-fpm as separate services; this file is
; used only by the deployable `render` image stage.
;
; Everything logs to stdout/stderr so `render logs` / `docker logs` show both
; processes interleaved, and nothing needs a writable log directory.
;
; This is the WHOLE config, not a snippet dropped into a conf.d: the packaged
; supervisord.conf declares a [unix_http_server] socket under /run, which the
; unprivileged `app` user cannot create — supervisord then dies with
; "Cannot open an HTTP server: socket.error reported errno.EACCES (13)".
; No control socket is declared because nothing here runs supervisorctl.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; php-fpm first. nginx 502s for the moment before fpm is listening, which is why
; the platform health check must point at /up — it goes through fpm, so the
; container is only reported healthy once both halves are actually up.
[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; `-e stderr`: nginx opens its compiled-in default error log
; (/var/lib/nginx/logs/error.log, owned by the nginx user) *before* it parses
; nginx.conf, so the `error_log` directive in the file cannot prevent an
; 'could not open error log file ... Permission denied' alert on every start.
; This routes the log to stderr from the first byte instead.
;
; `pid` is set in nginx.conf at build time. Passing it via `-g` here instead
; collides with the file's own directive and nginx refuses to start with
; "pid directive is duplicate".
command=nginx -e stderr -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
