; php-fpm pool overrides for the single-container `render` image stage.
; Mounted at /usr/local/etc/php-fpm.d/zzz-render.conf so it loads AFTER
; zz-www.conf and wins.
;
; Render's Free compute plan is 0.1 CPU / 512 MB RAM for the WHOLE container —
; nginx, supervisord and php-fpm together. docker/php/www.conf is sized for a
; developer machine (pm.max_children = 20, memory_limit 512M per worker), which
; on 512 MB total gets the container OOM-killed under the mildest concurrency.
; The symptom is intermittent 502s that look like an application bug.
;
; Measured on the built image, constrained to Render's Free plan exactly
; (`docker run --memory 512m --cpus 0.1`) and driven with 30 concurrent
; authenticated dashboard requests: all 200, peak RSS for the whole container
; 81 MiB of 512 MiB (16%), no OOM kill, no worker restarts.
[www]
; `ondemand` rather than `dynamic`: with 0.1 CPU there is no benefit to holding
; idle workers resident, and every resident worker is memory this box cannot
; spare. Workers spawn on demand and retire after 10 idle seconds.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s

; Recycle sooner than the dev pool's 500. Nothing here leaks, but a smaller
; number bounds the worst case if a dependency ever does.
pm.max_requests = 300

; Per-request ceiling. The heaviest page is the dashboard, which runs a handful
; of aggregate queries and renders five charts from arrays — nowhere near this.
; The seeder, which is the only genuinely memory-hungry code path, cannot run in
; this image at all (fakerphp/faker is a dev dependency).
php_admin_value[memory_limit] = 128M
