; OPcache + JIT — mounted at /usr/local/etc/php/conf.d/10-opcache.ini

[opcache]
opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Development default: PHP re-stats files so edits on a bind mount take effect
; immediately. Production images SHOULD run with 0 (no stat() per request) and
; rely on a fresh container per deploy — set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
; in the environment to flip it without rebuilding the image.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.huge_code_pages = 0
opcache.log_verbosity_level = 1
