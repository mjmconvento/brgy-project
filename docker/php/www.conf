; php-fpm pool — mounted at /usr/local/etc/php-fpm.d/zz-www.conf
; Loaded after www.conf from the base image, so it redefines the [www] pool.

[www]
; The container already runs as `app` (USER app in the Dockerfile), so php-fpm
; logs "I'm not root, ignoring user/group" and keeps its identity. The lines
; stay so the same pool is still correct when the image is started as root.
user = app
group = app

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.status_path = /fpm-status

; Container environment variables (DB_HOST, REDIS_HOST, ...) must reach PHP.
clear_env = no

; Worker stdout/stderr is forwarded verbatim to the container log.
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/1
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d ms %{kilo}M kB %C%%"

slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 65s

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
